name: Update cask

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point the cask at the latest release
        id: update
        run: echo "version=$(scripts/update-cask.sh)" >> "$GITHUB_OUTPUT"
      - name: Commit
        if: steps.update.outputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "dictivo ${{ steps.update.outputs.version }}"
          git push
